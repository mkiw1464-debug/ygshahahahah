name: Build FFEX IPA

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          for ver in Xcode_16.3 Xcode_16.2 Xcode_16.1 Xcode_16; do
            if [ -d "/Applications/${ver}.app" ]; then
              sudo xcode-select -s "/Applications/${ver}.app/Contents/Developer"
              break
            fi
          done
          xcodebuild -version
          xcodebuild -showsdks 2>/dev/null | grep iphoneos || true

      - name: Verify structure
        run: |
          find "$GITHUB_WORKSPACE" -name "*.xcodeproj" -maxdepth 4
          ls "$GITHUB_WORKSPACE/FFExternal/" | head -20

      - name: Resolve project path
        id: paths
        run: |
          PROJ=$(find "$GITHUB_WORKSPACE" -name "FFExternal.xcodeproj" -maxdepth 4 | head -1)
          PROJ_DIR=$(dirname "$PROJ")
          echo "PROJ=$PROJ" >> $GITHUB_OUTPUT
          echo "PROJ_DIR=$PROJ_DIR" >> $GITHUB_OUTPUT
          echo "Project dir: $PROJ_DIR"

      - name: Install SwiftShield
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SSVER=$(curl -sf \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/rockbruno/swiftshield/releases/latest" \
            | grep '"tag_name"' | cut -d'"' -f4)
          [ -z "$SSVER" ] && SSVER="3.14.3"
          echo "SwiftShield $SSVER"
          curl -fL "https://github.com/rockbruno/swiftshield/releases/download/${SSVER}/swiftshield.zip" -o /tmp/ss.zip
          unzip -o /tmp/ss.zip -d /tmp/swiftshield
          SS_BIN=$(find /tmp/swiftshield -name "swiftshield" -type f | grep -v dSYM | head -1)
          chmod +x "$SS_BIN"
          echo "$(dirname "$SS_BIN")" >> $GITHUB_PATH

      - name: Obfuscate Swift symbols
        run: |
          cd "${{ steps.paths.outputs.PROJ_DIR }}"
          swiftshield obfuscate \
            --project-root . \
            --scheme FFExternal \
            --output-path "$RUNNER_TEMP/obfuscated" \
            --ignore-files "App.swift,DesignSystem.swift" \
            2>&1 | tee /tmp/swiftshield.log || true
          if [ -d "$RUNNER_TEMP/obfuscated" ]; then
            echo "SS_PROJ_DIR=$RUNNER_TEMP/obfuscated" >> $GITHUB_ENV
          else
            echo "SS_PROJ_DIR=${{ steps.paths.outputs.PROJ_DIR }}" >> $GITHUB_ENV
          fi

      - name: Build (unsigned)
        run: |
          set -o pipefail
          BUILD_DIR="${SS_PROJ_DIR:-${{ steps.paths.outputs.PROJ_DIR }}}"
          cd "$BUILD_DIR"

          xcodebuild archive \
            -project FFExternal.xcodeproj \
            -scheme FFExternal \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/FFExternal.xcarchive" \
            -destination "generic/platform=iOS" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ENABLE_BITCODE=NO \
            DEBUG_INFORMATION_FORMAT=dwarf-with-dsym \
            SWIFT_COMPILATION_MODE=wholemodule \
            SWIFT_OPTIMIZATION_LEVEL=-Osize \
            GCC_OPTIMIZATION_LEVEL=s \
            ENABLE_TESTABILITY=NO \
            DEAD_CODE_STRIPPING=YES \
            STRIP_INSTALLED_PRODUCT=YES \
            STRIP_STYLE=all \
            COPY_PHASE_STRIP=YES \
            GCC_SYMBOLS_PRIVATE_EXTERN=YES \
            2>&1 | tee /tmp/xcodebuild.log

          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            echo "=== BUILD FAILED - LAST 500 LINES ==="
            tail -500 /tmp/xcodebuild.log
            exit 1
          fi

      - name: Show build log on failure
        if: failure()
        run: tail -500 /tmp/xcodebuild.log || true

      - name: Package IPA
        run: |
          ARCHIVE="$RUNNER_TEMP/FFExternal.xcarchive"
          APP_PATH=$(find "$ARCHIVE" -name "*.app" -maxdepth 6 | head -1)
          [ -z "$APP_PATH" ] && echo "ERROR: .app not found" && exit 1
          IPA_STAGING="$RUNNER_TEMP/IPAStaging/Payload"
          mkdir -p "$IPA_STAGING"
          cp -R "$APP_PATH" "$IPA_STAGING/"
          cd "$RUNNER_TEMP/IPAStaging"
          zip -r "$RUNNER_TEMP/FFExternal.ipa" Payload/
          echo "IPA: $(du -sh "$RUNNER_TEMP/FFExternal.ipa")"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FFEX-${{ github.run_number }}
          path: ${{ runner.temp }}/FFExternal.ipa
          retention-days: 30
          if-no-files-found: error
